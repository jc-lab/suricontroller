# Realistic modify.conf.
re:. "\\$HOME_NET" "$INTERNAL_NET"
group:emerging-scan.rules "seconds (\d+)" "seconds 3600"
group:emerging-dns.rules "classtype:bad-unknown;" "classtype:policy-violation;"
metadata-add group:emerging-dns.rules "managed_by" "suricontroller"
2001219 "count \d+" "count 10"
re:ET\ TROJAN "(msg:\"ET TROJAN)" "\1 [modified]"
group:emerging-web_server.rules "flow:established,to_server" "flow:to_server,established"
re:ET\ CINS "^alert" "pass"
