version: "2"

linters:
  default: standard
  enable:
    - depguard
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1002", "-QF1003"]
    depguard:
      rules:
        controller:
          files: ["**/controller/**"]
          deny:
            - pkg: github.com/jc-lab/suricontroller/agent
              desc: the controller must not depend on agent packages
        agent:
          files: ["**/agent/**"]
          deny:
            - pkg: github.com/jc-lab/suricontroller/controller
              desc: the agent must not depend on controller packages
        adapters:
          files: ["**/adapters/**"]
          deny:
            - pkg: github.com/jc-lab/suricontroller/controller
              desc: proxy adapters must not depend on the controller
            - pkg: github.com/jc-lab/suricontroller/agent
              desc: proxy adapters must not depend on the agent
        pkg:
          files: ["**/pkg/**"]
          deny:
            - pkg: github.com/jc-lab/suricontroller/controller
              desc: shared packages must not depend on the controller
            - pkg: github.com/jc-lab/suricontroller/agent
              desc: shared packages must not depend on the agent
  exclusions:
    generated: strict
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [errcheck]
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jc-lab/suricontroller
