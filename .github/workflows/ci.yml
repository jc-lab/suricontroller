name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Suricata (for suricata -T tests)
        run: sudo apt-get update && sudo apt-get install -y suricata
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo modprobe nfnetlink_queue nft_queue || true
      - run: make integration

  images:
    runs-on: ubuntu-24.04
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/agent/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
