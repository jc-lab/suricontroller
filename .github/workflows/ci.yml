name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Rebuild the agent image for the selected branch/tag when Alpine ships a new
  # Suricata; it is a no-op if an image for that commit + Suricata already exists.
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the image for the current Suricata version already exists
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Suricata (for suricata -T tests)
        run: sudo apt-get update && sudo apt-get install -y suricata
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  integration:
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo modprobe nfnetlink_queue nft_queue || true
      - run: make integration

  # Builds each binary exactly once per architecture. The images and the release
  # both ship these very files, so their hashes match. Pure Go (CGO_ENABLED=0),
  # so every target cross-compiles on one runner.
  binaries:
    needs: [web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build
        run: |
          version=$(git describe --tags --always)
          ldflags="-s -w -X github.com/jc-lab/suricontroller/pkg/version.Version=$version"
          out="$RUNNER_TEMP/bin"
          build() { # os arch cmd
            local exe=$3
            if [[ $1 == windows ]]; then exe+=.exe; fi
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 \
              go build -trimpath -ldflags "$ldflags" -o "$out/${1}_${2}/$exe" "./cmd/$3"
          }
          for platform in linux/amd64 linux/arm64; do
            IFS=/ read -r os arch <<<"$platform"
            for cmd in suri-controller suri-node-agent snort2suricata; do
              build "$os" "$arch" "$cmd"
            done
          done
          # The rule converter is a standalone tool, also built for desktops.
          for platform in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read -r os arch <<<"$platform"
            build "$os" "$arch" snort2suricata
          done
          {
            echo "Binaries \`$version\`:"
            echo '```'
            (cd "$out" && sha256sum -- */*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
          if-no-files-found: error
          retention-days: 1

  # Resolves the Suricata version the agent image will ship (it comes from the
  # Alpine repo, so it can change without a commit) and decides what to build.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      suricata: ${{ steps.suricata.outputs.version }}
      suricata-tag: ${{ steps.suricata.outputs.tag }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Suricata version
        id: suricata
        run: |
          base=$(sed -nE 's/^FROM (alpine:[^ ]+).*/\1/p' deploy/agent/Dockerfile | tail -n1)
          pkg=$(docker run --rm "$base" sh -c 'apk update -q >/dev/null && apk search -x suricata')
          version=${pkg#suricata-}
          if [[ ! $version =~ ^[0-9][^[:space:]]*-r[0-9]+$ ]]; then
            echo "::error::unexpected apk output from $base: $pkg"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version%-r*}" >> "$GITHUB_OUTPUT"
          echo "Suricata in \`$base\`: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Plan
        id: plan
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/suri-node-agent
          SURICATA_TAG: ${{ steps.suricata.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          images='["suri-node-agent","suri-controller"]'
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            # Same tag images-merge produces via metadata-action's type=sha.
            ref="$IMAGE:sha-${GITHUB_SHA::7}-suricata$SURICATA_TAG"
            if [[ $FORCE != true ]] && docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "\`$ref\` already exists; nothing to build." >> "$GITHUB_STEP_SUMMARY"
              images='[]'
            else
              images='["suri-node-agent"]'
            fi
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Each platform is built natively on its own runner (amd64 / arm64) and pushed
  # by digest; images-merge then stitches the digests into one multi-arch tag.
  images:
    needs: [resolve, go, binaries]
    if: needs.resolve.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Prepare
        id: prep
        run: |
          chmod +x "$RUNNER_TEMP"/bin/*/*
          platform='${{ matrix.platform }}'
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "bindir=$RUNNER_TEMP/bin/${platform//\//_}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image == 'suri-node-agent' && 'agent' || 'controller' }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: binary=${{ steps.prep.outputs.bindir }}
          build-args: ${{ matrix.image == 'suri-node-agent' && format('SURICATA_VERSION={0}', needs.resolve.outputs.suricata) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.prep.outputs.pair }}
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images-merge:
    if: github.event_name != 'pull_request' && needs.resolve.outputs.images != '[]'
    needs: [resolve, images]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.images) }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      SURICATA_SUFFIX: ${{ matrix.image == 'suri-node-agent' && format('-suricata{0}', needs.resolve.outputs.suricata-tag) || '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The agent also gets immutable "-suricata<version>" variants; the plain
          # tags follow the most recent build.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch,suffix=${{ env.SURICATA_SUFFIX }},enable=${{ env.SURICATA_SUFFIX != '' }}
            type=semver,pattern={{version}},suffix=${{ env.SURICATA_SUFFIX }},enable=${{ env.SURICATA_SUFFIX != '' }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ env.SURICATA_SUFFIX }},enable=${{ env.SURICATA_SUFFIX != '' }}
            type=sha,suffix=${{ env.SURICATA_SUFFIX }},enable=${{ env.SURICATA_SUFFIX != '' }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${refs[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # On a v* tag push, attach the binaries (the same files baked into the
  # images) to a GitHub release.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, integration, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Package
        run: |
          version=$GITHUB_REF_NAME
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          for dir in "$RUNNER_TEMP"/bin/*/; do
            platform=$(basename "$dir")
            for bin in "$dir"*; do
              file=$(basename "$bin")
              cmd=${file%.exe}
              name="${cmd}_${version}_${platform}"
              mkdir -p "$out/$name"
              install -m 0755 "$bin" "$out/$name/$file"
              cp LICENSE README.md "$out/$name/"
              case $cmd in
                suri-node-agent) cp deploy/agent/agent.yaml.example "$out/$name/" ;;
                snort2suricata) cp docs/snort2suricata.md "$out/$name/" ;;
              esac
              if [[ $platform == windows_* ]]; then
                (cd "$out" && zip -qr "$name.zip" "$name")
              else
                tar -C "$out" -czf "$out/$name.tar.gz" "$name"
              fi
              rm -rf "${out:?}/$name"
            done
          done
          (cd "$out" && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          # Re-runs replace the assets of the existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/dist/* --clobber
          else
            flags=()
            if [[ $tag == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes "${flags[@]}"
          fi
